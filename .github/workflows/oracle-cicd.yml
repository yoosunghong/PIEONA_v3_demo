name: Oracle CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Validate deployable package
        run: node scripts/package-release.mjs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: oracle-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/package-release.mjs
      - name: Deploy verified commit
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.ORACLE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.ORACLE_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" == pieona-deploy ]]
          [[ -n "$DEPLOY_KEY" && -n "$KNOWN_HOSTS" ]]
          task_ssh_dir=$(mktemp -d)
          trap 'rm -rf "$task_ssh_dir"' EXIT
          chmod 700 "$task_ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$task_ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$task_ssh_dir/known_hosts"
          chmod 600 "$task_ssh_dir/key"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$task_ssh_dir/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -i "$task_ssh_dir/key" "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $GITHUB_SHA" < artifacts/pieona-release.tar.gz
      - name: Verify public HTTPS release when configured
        env:
          PUBLIC_URL: ${{ vars.ORACLE_PUBLIC_URL }}
        run: |
          if [[ -n "$PUBLIC_URL" ]]; then
            node scripts/check-public-release.mjs "$PUBLIC_URL" "$GITHUB_SHA"
          fi
